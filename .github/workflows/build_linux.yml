name: Build Linux

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        description: "Python version to build package for"
        default: "3.14"
      arch:
        type: string
        description: "Architecture to build package for (e.g. x86_64, aarch64)"
        default: "x86_64"

env:
  PYTHON_VERSION: ${{ inputs.python_version }}

jobs:
  build_linux:
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    name: Build Linux Package (Python ${{ inputs.python_version }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          submodules: recursive

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Select manylinux Python tag
        run: |
          case "${{ env.PYTHON_VERSION }}" in
            "3.10") echo "MANYLINUX_PYTAG=cp310-cp310" >> "$GITHUB_ENV" ;;
            "3.11") echo "MANYLINUX_PYTAG=cp311-cp311" >> "$GITHUB_ENV" ;;
            "3.12") echo "MANYLINUX_PYTAG=cp312-cp312" >> "$GITHUB_ENV" ;;
            "3.13") echo "MANYLINUX_PYTAG=cp313-cp313" >> "$GITHUB_ENV" ;;
            "3.14") echo "MANYLINUX_PYTAG=cp314-cp314" >> "$GITHUB_ENV" ;;
            *)
              echo "Unsupported python-version: ${{ env.PYTHON_VERSION }}"
              exit 1
              ;;
          esac

      - name: Build and repair wheel in manylinux container
        id: build_linux
        run: |
          rm -rf dist wheelhouse
          mkdir -p dist wheelhouse

          docker run --rm \
            -e PYTAG="${MANYLINUX_PYTAG}" \
            -v "${{ github.workspace }}:/io" \
            -w /io \
            quay.io/pypa/manylinux_2_34:latest \
            /bin/bash -lc '
              set -euo pipefail
              if ! command -v cmake >/dev/null 2>&1; then
                dnf install -y cmake gcc gcc-c++ make ninja-build
              fi
              "/opt/python/${PYTAG}/bin/python" -m pip install --upgrade pip setuptools wheel build auditwheel
              "/opt/python/${PYTAG}/bin/python" -m build --wheel -o dist
              auditwheel repair dist/*.whl -w wheelhouse
            '

          pkg=$(basename "$(ls wheelhouse/*.whl)")
          echo "Built Linux package: $pkg"
          echo "pkg=$pkg" >> $GITHUB_ENV
      
      - name: Upload Linux Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: linux-package-${{ env.PYTHON_VERSION }}-on-${{ inputs.arch }}
          path: wheelhouse/*.whl

      - name: Run pytest
        run: |
          pip install wheelhouse/*.whl pytest
          cd tests  # so that it doesn't try to import the local directory
          pytest .
