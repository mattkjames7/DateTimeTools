name: Build macOS

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        description: "Python version to build package for"
        default: "3.14"
      arch:
        type: string
        description: "Architecture to build package for (e.g. x86_64, aarch64)"
        default: "x86_64"

env:
  PYTHON_VERSION: ${{ inputs.python_version }}

jobs:
  build_macos:
    name: Build macOS Package (Python ${{ inputs.python_version }})
    runs-on: ${{ inputs.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          submodules: recursive

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip build wheel
          brew install cmake ninja
      
      - name: Build macOS Package
        id: build_macos
        run: |
          export CMAKE_OSX_ARCHITECTURES="$(uname -m)"
          export CMAKE_OSX_DEPLOYMENT_TARGET="11.0"
          export MACOSX_DEPLOYMENT_TARGET="11.0"
          python -m build --wheel -o dist
          pkg=$(basename "$(ls dist/*.whl)")
          echo "Built macOS package: $pkg"
          echo "pkg=$pkg" >> $GITHUB_ENV
      
      - name: Upload macOS Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: macos-package-${{ env.PYTHON_VERSION }}-on-${{ inputs.arch }}
          path: dist/*.whl
      
      - name: Run pytest
        run: |
          pip install dist/$pkg pytest
          cd tests  # so that it doesn't try to import the local directory
          pytest .
