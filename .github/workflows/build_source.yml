name: Build Source

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        description: "Python version to build package for"
        default: "3.14"

env:
  PYTHON_VERSION: ${{ inputs.python_version }}

jobs:
  build_source:
    name: Build Source Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          submodules: recursive

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build Source Package
        id: build_source
        run: |
          python -m build --sdist -o dist
          pkg=$(basename "$(ls dist/*.tar.gz)")
          echo "Built Source package: $pkg"
          echo "pkg=$pkg" >> $GITHUB_ENV

      - name: Upload Source Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: source-package
          path: dist/*.tar.gz

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      
      - name: Build Docker Image for Source Package Testing
        run: |
          pyver="${{ env.PYTHON_VERSION }}"
          pyref="py${pyver//./}"
          docker_image="datetimetools:${pyref}"
          echo "Docker image: ${docker_image}"
          echo "docker_image=${docker_image}" >> $GITHUB_ENV
          docker build --build-arg PYTHON_VERSION=${pyver} -t $docker_image .
      
      - name: Run Docker Image
        run: |
          echo "docker_image is 'docker_image'"
          docker_container=dttest
          echo "docker_container=$docker_container" >> $GITHUB_ENV
          docker run --name $docker_container --rm -d $docker_image

      - name: Copy Source Package into Docker
        run: |
          docker cp dist/$pkg $docker_container:/DateTimeTools/dist/$pkg  

      - name: Install and Test Source Package
        run: |
          docker exec -u ubuntu $docker_container bash -c "source /app/venv/bin/activate && pip install /DateTimeTools/dist/$pkg pytest"
          docker exec -u ubuntu $docker_container bash -c "cd /DateTimeTools/tests && source /app/venv/bin/activate && pytest ."
          
      - name: Cleanup Docker Container
        run: |
          docker rm -f $docker_container || true
