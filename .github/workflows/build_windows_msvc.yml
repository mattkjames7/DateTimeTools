name: Build Windows (MSVC)

on:
  workflow_call:
    inputs:
      python_version:
        type: string
        description: "Python version to build package for"
        default: "3.14"
      arch:
        type: string
        description: "Architecture to build package for (e.g. x86_64, aarch64)"
        default: "x86_64"

env:
  PYTHON_VERSION: ${{ inputs.python_version }}

jobs:
  build_windows_msvc:
    name: Build Windows Package (Python ${{ inputs.python_version }})
    runs-on: ${{ inputs.arch == 'x86_64' && 'windows-2025' || 'windows-11-arm' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          submodules: recursive
              
      - name: Set up Windows Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: Add Windows Python to PATH
        shell: pwsh
        run: |
          echo "$pythonLocation" >> $GITHUB_PATH
        env:
          pythonLocation: ${{ env.pythonLocation }}
      

      - name: Install Python build tools
        shell: pwsh
        run: |
          $env:PATH="$env:pythonLocation;$env:PATH"
          python -m pip install --upgrade pip build wheel pytest
        env:
          pythonLocation: ${{ env.pythonLocation }}

      - name: Build Windows Package
        id: build_windows
        shell: pwsh
        run: |
          $env:PATH="$env:pythonLocation;$env:PATH"
          python -m build --wheel -o dist
          $pkg = (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1 -ExpandProperty Name)
          Write-Output "Built Windows package: $pkg"
          echo "pkg=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        env:
          pythonLocation: ${{ env.pythonLocation }}


      - name: Upload Windows Package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: windows-package-${{ env.PYTHON_VERSION }}-on-${{ inputs.arch }}
          path: dist/*.whl

      - name: Run pytest
        shell: pwsh
        run: |
          $env:PATH="$env:pythonLocation;$env:PATH"
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel found in dist/" }
          python -m pip install $wheel.FullName pytest
          cd tests  # so that it doesn't try to import the local directory
          python -m pytest .
        env:
          pythonLocation: ${{ env.pythonLocation }}

